[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo"
version = "0.11.0"
description = "Gemelo digital marino del Mar Menor con IA explicable"
readme = "README.md"
requires-python = ">=3.11"
# Núcleo mínimo: lo que necesita cualquier parte (incluida la API)
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
# Fases 1-2: descarga, procesado de cubos y exploración
datos = [
    "copernicusmarine",
    "xarray",
    "dask",
    "netCDF4",
    "zarr",
    "geopandas",
    "rioxarray",
    "matplotlib",
    "cartopy",
]
# Fase 3: entrenamiento, XAI y seguimiento de experimentos
ml = ["scikit-learn", "xgboost", "shap", "mlflow", "matplotlib"]
# Fase 4: servicio (sin MLflow ni stack geoespacial: imagen ligera)
api = ["fastapi", "uvicorn", "httpx", "scikit-learn", "xgboost", "shap"]
# Fase 6: dashboard (cliente HTTP de la API: no carga modelos)
dashboard = ["streamlit", "plotly", "httpx"]
dev = ["pytest", "ruff"]
# Solo para abrir los notebooks. Aparte porque JupyterLab trae rutas de fichero muy profundas: en Windows,
# si el proyecto está en una carpeta con ruta larga, supera el límite de 260 caracteres y la instalación falla.
notebooks = ["jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

# El visor 4D (HTML/JS) viaja dentro del paquete: la imagen Docker lo instala sin modo editable
[tool.setuptools.package-data]
"gemelo.servicio" = ["visor/*"]

[tool.ruff]
line-length = 100
