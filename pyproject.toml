[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemelo"
version = "0.5.0"
description = "Gemelo digital marino del Mar Menor con IA explicable"
readme = "README.md"
requires-python = ">=3.11"
# Núcleo mínimo: lo que necesita cualquier parte (incluida la API)
dependencies = [
    "pandas",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
# Fases 1-2: descarga, procesado de cubos y exploración
datos = [
    "copernicusmarine",
    "xarray",
    "dask",
    "netCDF4",
    "zarr",
    "geopandas",
    "rioxarray",
    "matplotlib",
    "cartopy",
]
# Fase 3: entrenamiento, XAI y seguimiento de experimentos
ml = ["scikit-learn", "xgboost", "shap", "mlflow", "matplotlib"]
# Fase 4: servicio (sin MLflow ni stack geoespacial: imagen ligera)
api = ["fastapi", "uvicorn", "httpx", "scikit-learn", "xgboost", "shap"]
# Fase 6: dashboard
dashboard = ["streamlit"]
dev = ["jupyterlab", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
