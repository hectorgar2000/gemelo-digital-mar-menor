# Configuración única de la zona y de las fuentes de datos.
# Todos los scripts leen de aquí: si cambia la zona o el periodo, se cambia solo en este fichero.

zona:
  nombre: mar_menor
  bbox:                     # grados; longitudes oeste en negativo
    lat_min: 37.50
    lat_max: 38.00
    lon_min: -0.95
    lon_max: -0.50

# Subzonas para las series medias (decididas en la exploración de la Fase 1)
subzonas:
  laguna: {lat: [37.67, 37.82], lon: [-0.84, -0.735]}   # 6 celdas SST, 91 de clorofila, 0 del modelo
  costa: {lat: [37.55, 38.00], lon: [-0.66, -0.50]}     # mar abierto al este de La Manga

periodo:
  inicio: "1998-01-01"
  fin: "2026-09-30"

particion:                  # temporal, nunca aleatoria
  train: ["1998-01-01", "2018-12-31"]
  validacion: ["2019-01-01", "2021-12-31"]
  test: ["2022-01-01", "2026-09-30"]

horizontes_dias: [1, 3, 7, 30]   # 30 = experimental

umbrales:
  hipoxia_mg_l: 4.0
  hipoxia_area_pct: 10      # evento = más del 10 % del fondo de la laguna por debajo de 4 mg/L
  anoxia_mg_l: 2.0
  mhw_percentil: 90
  mhw_dias_min: 5
  climatologia: ["1991-01-01", "2020-12-31"]

# dataset_id verificados con `copernicusmarine describe` (2026-11-09)
# Opcionales por dataset: `inicio` (si difiere de periodo.inicio) y `profundidad_max` (m).
copernicus:
  sst:
    dataset_id: cmems_SST_MED_SST_L4_REP_OBSERVATIONS_010_021
    variables: [analysed_sst, analysis_error]
    inicio: "1982-01-01"    # desde el principio: hace falta para la climatología 1991-2020
  clorofila:
    dataset_id: cmems_obs-oc_med_bgc-plankton_my_l4-gapfree-multi-1km_P1D
    variables: [CHL]
  fisica_temp:
    dataset_id: cmems_mod_med_phy-temp_my_4.2km_P1D-m
    variables: [thetao, bottomT]
    profundidad_max: 2      # solo el nivel superficial de thetao (~1 m)
  fisica_mld:
    dataset_id: cmems_mod_med_phy-mld_my_4.2km_P1D-m
    variables: [mlotst]
  fisica_hflux:
    dataset_id: cmems_mod_med_phy-hflux_my_4.2km_P1D-m
    variables: [hfds]
  fisica_mflux:
    dataset_id: cmems_mod_med_phy-mflux_my_4.2km_P1D-m
    variables: [tauuo, tauvo]

# Meteorología ERA5 (0,25°) vía API de Open-Meteo: sin cuenta, uso no comercial.
# Open-Meteo ajusta cada punto a la celda ERA5 más adecuada (comprobado 2026-11-09):
#   cuenca -> 37.75N 1.00W (Campo de Cartagena, cuenca que drena a la laguna)
#   mar    -> 37.75N 0.50W
meteo:
  url: https://archive-api.open-meteo.com/v1/archive
  modelo: era5
  inicio: "1982-01-01"
  puntos:
    cuenca: {lat: 37.73, lon: -0.79}
    mar: {lat: 37.75, lon: -0.60}
  variables:
    - temperature_2m_mean
    - temperature_2m_max
    - precipitation_sum
    - wind_speed_10m_mean
    - wind_speed_10m_max
    - wind_direction_10m_dominant
    - shortwave_radiation_sum

# Servidor de Datos Científicos del Mar Menor (UPCT): mapas L2 semanales, 200x200, 10 niveles 0,5-5 m.
# Cada variable es un fichero <Variable>.nc con la misma rejilla (comprobado 2026-11-09).
upct:
  thredds_opendap: https://marmenor.upct.es/thredds/dodsC/L2
  variables: [Oxigeno, Temperatura, Salinidad, Clorofila, Turbidez]
  # Control de calidad: medias de laguna por debajo de este valor se marcan como NaN.
  # Motivo: mar-abr 2017 (inicio de la serie) da salinidad superficial media de 6-23 con fondo ~40;
  # no es físico para una laguna hipersalina (~42-45). La DANA de 2019 bajó la superficie a ~35 (se conserva).
  # PENDIENTE de confirmar con la UPCT.
  sal_sup_min_plausible: 30
