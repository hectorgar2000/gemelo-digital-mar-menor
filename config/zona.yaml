# Configuración única de la zona y de las fuentes de datos.
# Todos los scripts leen de aquí: si cambia la zona o el periodo, se cambia solo en este fichero.

zona:
  nombre: mar_menor
  bbox:                     # grados; longitudes oeste en negativo
    lat_min: 37.50
    lat_max: 38.00
    lon_min: -0.95
    lon_max: -0.50

# Subzonas para las series medias (decididas en la exploración de la Fase 1)
subzonas:
  laguna: {lat: [37.67, 37.82], lon: [-0.84, -0.735]}   # 6 celdas SST, 91 de clorofila, 0 del modelo
  costa: {lat: [37.55, 38.00], lon: [-0.66, -0.50]}     # mar abierto al este de La Manga

periodo:
  inicio: "1998-01-01"
  fin: "2026-09-30"

particion:                  # temporal, nunca aleatoria
  train: ["1998-01-01", "2018-12-31"]
  validacion: ["2019-01-01", "2021-12-31"]
  test: ["2022-01-01", "2026-09-30"]

horizontes_dias: [1, 3, 7, 30]   # 30 = experimental

umbrales:
  hipoxia_mg_l: 4.0
  hipoxia_area_pct: 10      # evento = más del 10 % del fondo de la laguna por debajo de 4 mg/L
  anoxia_mg_l: 2.0
  mhw_percentil: 90
  mhw_dias_min: 5
  climatologia: ["1991-01-01", "2020-12-31"]

# dataset_id verificados con `copernicusmarine describe` (2026-11-09)
# Opcionales por dataset: `inicio` (si difiere de periodo.inicio) y `profundidad_max` (m).
copernicus:
  sst:
    dataset_id: cmems_SST_MED_SST_L4_REP_OBSERVATIONS_010_021
    variables: [analysed_sst, analysis_error]
    inicio: "1982-01-01"    # desde el principio: hace falta para la climatología 1991-2020
  clorofila:
    dataset_id: cmems_obs-oc_med_bgc-plankton_my_l4-gapfree-multi-1km_P1D
    variables: [CHL]
  fisica_temp:
    dataset_id: cmems_mod_med_phy-temp_my_4.2km_P1D-m
    variables: [thetao, bottomT]
    profundidad_max: 2      # solo el nivel superficial de thetao (~1 m)
  fisica_mld:
    dataset_id: cmems_mod_med_phy-mld_my_4.2km_P1D-m
    variables: [mlotst]
  fisica_hflux:
    dataset_id: cmems_mod_med_phy-hflux_my_4.2km_P1D-m
    variables: [hfds]
  fisica_mflux:
    dataset_id: cmems_mod_med_phy-mflux_my_4.2km_P1D-m
    variables: [tauuo, tauvo]

# Meteorología ERA5 (0,25°) vía API de Open-Meteo: sin cuenta, uso no comercial.
# Open-Meteo ajusta cada punto a la celda ERA5 más adecuada (comprobado 2026-11-09):
#   cuenca -> 37.75N 1.00W (Campo de Cartagena, cuenca que drena a la laguna)
#   mar    -> 37.75N 0.50W
meteo:
  url: https://archive-api.open-meteo.com/v1/archive
  modelo: era5
  inicio: "1982-01-01"
  puntos:   # lat/lon = lo que se pide a la API; celda = la celda ERA5 que devuelve (comprobado)
    cuenca: {lat: 37.73, lon: -0.79, celda: {lat: 37.75, lon: -1.00}}
    mar: {lat: 37.75, lon: -0.60, celda: {lat: 37.75, lon: -0.50}}
  variables:
    - temperature_2m_mean
    - temperature_2m_max
    - precipitation_sum
    - wind_speed_10m_mean
    - wind_speed_10m_max
    - wind_direction_10m_dominant
    - shortwave_radiation_sum

# Previsiones meteorológicas REALES archivadas (Open-Meteo "Previous Runs"): para cada día, la previsión
# emitida 1..7 días antes. Comprobado 2026-11-10: completas (temp, viento, dirección, lluvia, radiación)
# desde 2024-02; antes de 2024 solo temperatura. Se piden en las celdas ERA5 (meteo.puntos.*.celda).
prevision:
  url: https://previous-runs-api.open-meteo.com/v1/forecast
  inicio: "2024-02-01"
  dias_max: 7                                  # antelación máxima archivada
  calibracion: ["2024-02-01", "2024-07-31"]    # sesgo previsión - ERA5 (excluido de la evaluación)
  evaluacion: ["2024-08-01", "2026-09-30"]     # prueba honesta con previsiones reales
  variables_horarias: [temperature_2m, wind_speed_10m, wind_direction_10m, precipitation, shortwave_radiation]

# Intervalo de predicción del 90 % (conformal en cascada; ver monitor.metricas.cuantiles_conformales)
intervalo:
  anios: 3          # residuos de la misma época de los últimos 3 años...
  margen_dias: 45   # ... ± 45 días alrededor del día del año
  min_residuos: 60  # si no hay suficientes: últimos 365 días; si tampoco, cuantiles de validación

# Monitor de deriva y reentrenamiento (Fase 7, bloque 2)
monitor:
  ventana_dias: 90            # ventana reciente que se vigila
  margen_estacional_dias: 15  # la referencia de entrenamiento usa los mismos días del año (± margen)
  top_variables: 10           # variables más importantes del modelo que se vigilan en las entradas
  # PSI (desplazamiento de distribución). El umbral de 0,25 de manual NO sirve aquí: las anomalías persisten
  # semanas y cualquier ventana de 90 días parece desplazada incluso en años normales. Se calibra por modelo
  # con el percentil del PSI en años normales (scripts/monitorizar.py --calibrar); 0,25 solo es el respaldo.
  psi_deriva: 0.25
  psi_percentil_calibracion: 95
  anios_calibracion: [2010, 2018]
  max_fuera_rango: 0.10       # fracción de días con alguna variable importante fuera del rango de entrenamiento
  cobertura_min: 0.80         # cobertura real mínima del intervalo del 90 %
  skill_min: 0.0              # el modelo debe batir a la persistencia (1 - RMSE_modelo / RMSE_persistencia)
  sesgo_prevision_max: {t2m: 0.5, viento: 2.0, rad: 1.0}   # cambio del sesgo de la previsión (°C, km/h, MJ/m²)
  disparar_con: [DERIVA, AVISO]   # estados que lanzan un reentrenamiento (la regla de promoción protege)

reentrenamiento:
  ventana_evaluacion_dias: 180    # últimos días (con verdad conocida) para comparar campeón y retador
  dias_minimos_entre_reentrenos: 90  # sin esto, un modelo recién reentrenado se volvería a proponer en bucle
  mejora_minima: 0.02             # el retador solo se promociona si mejora >= 2 % al campeón

# Servidor de Datos Científicos del Mar Menor (UPCT): mapas L2 semanales, 200x200, 10 niveles 0,5-5 m.
# Cada variable es un fichero <Variable>.nc con la misma rejilla (comprobado 2026-11-09).
upct:
  thredds_opendap: https://marmenor.upct.es/thredds/dodsC/L2
  variables: [Oxigeno, Temperatura, Salinidad, Clorofila, Turbidez]
  # Control de calidad: medias de laguna por debajo de este valor se marcan como NaN.
  # Motivo: mar-abr 2017 (inicio de la serie) da salinidad superficial media de 6-23 con fondo ~40;
  # no es físico para una laguna hipersalina (~42-45). La DANA de 2019 bajó la superficie a ~35 (se conserva).
  # PENDIENTE de confirmar con la UPCT.
  sal_sup_min_plausible: 30
